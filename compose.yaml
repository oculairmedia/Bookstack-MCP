services:
  bookstackmcp:
    build:
      context: .
    image: bookstackmcp:http
    ports:
      - "${PORT:-3054}:${PORT:-3054}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3054}
      - BS_URL=${BS_URL}
      - BS_TOKEN_ID=${BS_TOKEN_ID}
      - BS_TOKEN_SECRET=${BS_TOKEN_SECRET}
    healthcheck:
      test: ["CMD", "python", "/app/fastmcp_server/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
